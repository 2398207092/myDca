server:
  port: 8080

spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/fund_tracker?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&createDatabaseIfNotExist=true}
    username: ${DB_USERNAME:fundapp}
    password: ${DB_PASSWORD:CHANGE_ME}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 2
      connection-timeout: 5000
      idle-timeout: 300000
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    # P2-12：关闭 OSIV，Session 只在事务期打开，避免视图层懒加载意外触发 SQL
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

  mail:
    host: smtp.163.com
    port: 465
    username: ${MAIL_USERNAME:CHANGE_ME}
    password: ${MAIL_PASSWORD:CHANGE_ME}
    default-encoding: UTF-8
    properties:
      mail.smtp.auth: true
      mail.smtp.ssl.enable: true
      mail.smtp.connectiontimeout: 15000
      mail.smtp.timeout: 15000
      mail.smtp.writetimeout: 15000

springdoc:
  api-docs:
    path: /api-docs
    enabled: false  # P2-21：生产 systemd 未激活 prod profile，swagger 关闭直接放默认段（本地需要时手动临时开启）
  swagger-ui:
    path: /swagger-ui.html
    enabled: false

# 应用自定义配置
app:
  auth:
    token: ${APP_AUTH_TOKEN:CHANGE_ME}  # 生产环境必须通过环境变量注入随机 Token
    quick-login: ${AUTH_QUICK_LOGIN:false}  # 本地一键登录开关：仅开发环境设置 true
  # 管理员邮箱（用于备份/审计日志/监控日志等系统级接口的访问控制）
  # 未配置或保持 CHANGE_ME 时，这些接口默认全部拒绝访问，安全开箱
  admin:
    email: ${APP_ADMIN_EMAIL:CHANGE_ME}

# Actuator 运行监控（安全：只暴露 health/info，不暴露 env/metrics 等敏感端点）
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never  # 不显示数据库连接等明细，避免泄露内部信息

---
# 生产环境 profile（P2-21：Swagger/api-docs 游离在 /api/** 拦截外，公网匿名可看全 API 文档，prod 下整体关闭）
spring:
  config:
    activate:
      on-profile: prod

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
