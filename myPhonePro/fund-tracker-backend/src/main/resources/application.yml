server:
  port: 8080

spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/fund_tracker?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&createDatabaseIfNotExist=true}
    username: ${DB_USERNAME:fundapp}
    password: ${DB_PASSWORD:CHANGE_ME}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 2
      connection-timeout: 5000
      idle-timeout: 300000
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

  mail:
    host: smtp.163.com
    port: 465
    username: ${MAIL_USERNAME:CHANGE_ME}
    password: ${MAIL_PASSWORD:CHANGE_ME}
    default-encoding: UTF-8
    properties:
      mail.smtp.auth: true
      mail.smtp.ssl.enable: true
      mail.smtp.connectiontimeout: 15000
      mail.smtp.timeout: 15000
      mail.smtp.writetimeout: 15000

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

# 应用自定义配置
app:
  auth:
    token: ${APP_AUTH_TOKEN:CHANGE_ME}  # 生产环境必须通过环境变量注入随机 Token
  # 管理员邮箱（用于备份/审计日志/监控日志等系统级接口的访问控制）
  # 未配置或保持 CHANGE_ME 时，这些接口默认全部拒绝访问，安全开箱
  admin:
    email: ${APP_ADMIN_EMAIL:CHANGE_ME}

# Actuator 运行监控（安全：只暴露 health/info，不暴露 env/metrics 等敏感端点）
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never  # 不显示数据库连接等明细，避免泄露内部信息
