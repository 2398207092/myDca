<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>帧 A · 首屏（结构参考）</title>
<style>
  :root{ --ink:#14171A; --ink-2:#2A2F35; --muted:#6B7280; --faint:#9CA3AF; --line:#E3E5E8; --surface:#FFFFFF; --fill:#F4F5F6; --fill-2:#ECEEF0; }
  *{box-sizing:border-box}
  html,body{margin:0;background:#FFFFFF;color:var(--ink);font-family:"Microsoft YaHei","PingFang SC",sans-serif;-webkit-font-smoothing:antialiased}
  .phone{width:390px;height:844px;margin:0 auto;background:var(--fill);display:flex;flex-direction:column;padding:12px 16px 0;gap:12px}
  .top{display:flex;align-items:center;justify-content:space-between;min-height:36px;padding:0 2px}
  .brand{font-size:15px;font-weight:700}
  .brand small{font-size:10px;font-weight:400;color:var(--muted);margin-left:6px}
  .meta{font-size:10px;color:var(--muted)}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px}
  .hero{padding:24px 20px 22px;display:flex;flex-direction:column;gap:8px}
  .label{font-size:11px;color:var(--muted)}
  .big{font-family:"Segoe UI",Consolas,monospace;font-size:50px;font-weight:800;line-height:1;letter-spacing:-.02em}
  .big .cny{font-size:.5em;vertical-align:.4em;margin-right:2px;color:var(--muted)}
  .sub{font-size:11px;color:var(--muted)}
  .alloc{display:grid;grid-template-columns:104px 1fr;gap:16px;align-items:center;padding:20px 20px}
  .ring{position:relative;width:98px;height:98px;border-radius:50%;background:conic-gradient(#3E3E3E 0 28.3%, #6E6E6E 28.3% 50.9%, #939393 50.9% 67.8%, #B8B8B8 67.8% 74.7%, #DCDCDC 74.7% 100%);display:flex;align-items:center;justify-content:center}
  .ring::after{content:"";position:absolute;width:60px;height:60px;border-radius:50%;background:var(--surface)}
  .ring span{position:relative;font-size:10px;color:var(--muted);text-align:center;line-height:1.2}
  .rows{display:flex;flex-direction:column}
  .rows div{display:flex;align-items:baseline;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--line);font-size:11.5px}
  .rows div:last-child{border-bottom:0}
  .rows .k{color:var(--muted)}
  .rows .v{font-family:"Segoe UI",Consolas,monospace;font-weight:700;font-size:11.5px}
  .rows .target{color:var(--ink-2);font-weight:700}
  .cover{display:flex;flex-direction:column;gap:10px;padding:18px 20px}
  .cover .row{display:flex;align-items:baseline;justify-content:space-between;font-size:11px}
  .cover .row .k{color:var(--ink);font-weight:700}
  .cover .row .v{color:var(--muted)}
  .bar{height:10px;border-radius:99px;background:var(--fill-2);overflow:hidden}
  .bar i{display:block;height:100%;width:40%;background:var(--ink-2)}
  .nums{display:flex;justify-content:space-between;font-size:10px;color:var(--muted)}
  .nums b{color:var(--ink);font-family:"Segoe UI",Consolas,monospace;font-size:10.5px}
  .holdings{padding:16px 20px 12px}
  .hold-head{display:flex;align-items:baseline;justify-content:space-between;padding-bottom:8px;border-bottom:1px solid var(--line)}
  .hold-title{font-size:12.5px;font-weight:700}
  .hold-meta{font-size:10px;color:var(--muted)}
  .hold-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
  .hold-row:last-of-type{border-bottom:0}
  .hn{font-size:12px;font-weight:700}
  .hnum{display:flex;flex-direction:column;align-items:flex-end;gap:1px}
  .hv{font-family:"Segoe UI",Consolas,monospace;font-size:12.5px;font-weight:700}
  .hp{font-family:"Segoe UI",Consolas,monospace;font-size:9.5px;color:var(--muted)}
  .hold-more{margin-top:8px;font-size:10.5px;color:var(--muted);text-align:right}
  .entry span{color:var(--muted);font-weight:400;font-size:10px}
  .tabbar{display:flex;align-items:center;margin-top:auto;border-top:1px solid var(--line);background:var(--surface);padding:8px 4px 10px}
  .tab{flex:1;text-align:center;font-size:10px;color:var(--muted);padding:4px 0}
  .tab.on{color:var(--ink);font-weight:700}
  .tab i{display:block;width:18px;height:18px;margin:0 auto 3px;border:1.6px solid currentColor;border-radius:5px}
  .tab.on i{border-radius:6px}
</style>
</head>
<body>
<div class="phone">
  <div class="top"><div class="brand">种树<small>资产</small></div><div class="meta">11-07 · 已同步</div></div>

  <div class="card hero">
    <div class="label">总资产</div>
    <div class="big"><span class="cny">¥</span>128,640</div>
    <div class="sub">持仓 ¥96,180　现金 ¥32,460　今年 +5.3%</div>
  </div>

  <div class="card alloc">
    <div class="ring"><span>配置<br>占比</span></div>
    <div class="rows">
      <div><span class="k">红利</span><span class="v">28.3%</span></div>
      <div><span class="k">美股</span><span class="v">22.6%</span></div>
      <div><span class="k">宽基</span><span class="v">16.9%</span></div>
      <div><span class="k">黄金</span><span class="v">6.9%</span></div>
      <div><span class="k">现金</span><span class="v">25.2%</span></div>
      <div><span class="k target">目标偏离</span><span class="v">+1.7%</span></div>
    </div>
  </div>

  <div class="card cover">
    <div class="row"><span class="k">分红覆盖 2 / 5</span><span class="v">再攒 ¥680 点亮 交通通勤</span></div>
    <div class="bar"><i></i></div>
    <div class="nums"><span>今年已收 <b>¥3,860</b></span><span>预测 <b>¥6,120</b></span><span>下一笔 11-15 <b>¥460</b></span></div>
  </div>

  <div class="card holdings">
    <div class="hold-head"><span class="hold-title">持仓 6 支</span><span class="hold-meta">按市值</span></div>
    <div class="hold-row"><span class="hn">中证红利ETF</span><span class="hnum"><span class="hv">¥32,400</span><span class="hp">+4,120　+14.6%</span></span></div>
    <div class="hold-row"><span class="hn">沪深300ETF</span><span class="hnum"><span class="hv">¥21,800</span><span class="hp">+1,240　+6.0%</span></span></div>
    <div class="hold-row"><span class="hn">标普500ETF</span><span class="hnum"><span class="hv">¥18,600</span><span class="hp">+2,960　+18.9%</span></span></div>
    <div class="hold-more">查看全部 6 支 →</div>
  </div>

  <div class="tabbar">
    <div class="tab on"><i></i>首页</div>
    <div class="tab"><i></i>资产</div>
    <div class="tab"><i></i>记录</div>
    <div class="tab"><i></i>我的</div>
  </div>
</div>
</body>
</html>
