name: Deploy Frontend

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: myPhonePro/stitch_fund_dividend_tracker

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: myPhonePro/stitch_fund_dividend_tracker/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Deploy via SSH
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: admin
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: 'myPhonePro/stitch_fund_dividend_tracker/dist/'
          strip_components: 3
          target: '/www/wwwroot/fund-tracker/www/'
          rm: true

      - name: Verify deployment
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: admin
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e
            W=/www/wwwroot/fund-tracker/www

            # 属主必须是 admin：Windows tar 遗留的 197609 会让下次 scp-action 的 rm 失败
            OWNER=$(stat -c '%U' "$W")
            echo "owner: $OWNER"
            [ "$OWNER" = "admin" ] || { echo "FAIL: 属主为 $OWNER，应为 admin（sudo chown -R admin:admin $W）"; exit 1; }

            # 关键产物存在
            for f in index.html manifest.json sw.js icon-192.png icon-512.png favicon.svg; do
              [ -f "$W/$f" ] || { echo "FAIL: 缺少 $f"; exit 1; }
            done

            # manifest 已指向新图标
            grep -q 'icon-192.png' "$W/manifest.json" || { echo "FAIL: manifest 未更新"; exit 1; }

            echo "OK: 部署校验通过（属主 admin、6 个关键文件齐全、manifest 已更新）"
